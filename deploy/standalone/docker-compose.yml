name: gestion-backend-test

services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/standalone/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/standalone/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/standalone/.env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in deploy/standalone/.env}
    volumes:
      - gestion_backend_test_pgdata:/var/lib/postgresql/data
      - ./000_standalone_auth.sql:/docker-entrypoint-initdb.d/010-standalone-auth.sql:ro
      - ./001_standalone_extensions.sql:/docker-entrypoint-initdb.d/020-standalone-extensions.sql:ro
      - ./002_standalone_api_role.sql:/docker-entrypoint-initdb.d/030-standalone-api-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [backend_private]

  api:
    build:
      context: ../..
      dockerfile: deploy/standalone/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/standalone/.env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in deploy/standalone/.env}
      DB_AUTHENTICATED_ROLE: authenticated
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-127.0.0.1:18788}:8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [backend_private]

volumes:
  gestion_backend_test_pgdata:
    name: gestion_backend_test_pgdata

networks:
  backend_private:
    name: gestion_backend_test_private
