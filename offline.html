<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0369a1" />
    <title>ITC Stock | Hors connexion</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(92vw, 420px);
        padding: 28px;
        border: 1px solid #dbeafe;
        border-radius: 18px;
        background: white;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      img {
        width: 132px;
        height: auto;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: #475569;
        font-size: 14px;
        line-height: 1.55;
      }
      button {
        margin-top: 22px;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        background: #0369a1;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/pwa-icon-192.png" alt="ITC Stock" />
      <h1>Connexion indisponible</h1>
      <p>
        L'application est installee, mais les donnees Firebase ont besoin du
        reseau pour etre synchronisees.
      </p>
      <button type="button" onclick="window.location.reload()">Reessayer</button>
    </main>
  </body>
</html>
